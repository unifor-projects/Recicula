services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports configuradas apenas no override para dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    # ports configuradas apenas no override para dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      # Uploads precisam sobreviver ao recriar o container
      - ./backend/uploads:/app/uploads
    # O frontend só sobe depois que as migrações rodaram e o ASGI (FastAPI +
    # Socket.IO) está respondendo, senão o cliente de chat entra em retry logo no boot.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\""]
      # 30s para nao poluir `docker compose logs` com um GET / a cada poucos segundos
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next_cache:
